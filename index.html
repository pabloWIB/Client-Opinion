<body>
  <header class="site-header">
    <div class="container">
      <a class="site-header__brand" href="index.html" aria-current="page">Joyful<span>Bloomers</span></a>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      <section class="reviews" aria-labelledby="reviews-title">
        <div class="reviews__intro">
          <img class="reviews__source" src="assets/img/logo/google.svg" width="78" height="28" alt="Google Reviews">
          <p class="reviews__eyebrow">Reviews</p>
          <h1 id="reviews-title">Our clients say</h1>
        </div>

        <div class="carousel" data-carousel>
          <div class="carousel__viewport" data-carousel-viewport aria-live="polite">
            <ul class="carousel__track" data-carousel-track>
              <li class="carousel__slide" data-carousel-slide>
                <figure class="review">
                  <blockquote class="review__quote">
                    <p>“Ordered flowers online and they were the best bouquet! Impressed everyone around. Highly recommend this flower shop!”</p>
                  </blockquote>
                  <figcaption class="review__author">Sarah Thompson</figcaption>
                </figure>
              </li>
              <li class="carousel__slide" data-carousel-slide>
                <figure class="review">
                  <blockquote class="review__quote">
                    <p>“I was hesitant about ordering flowers online, but I’m so glad I did! The bouquet I received was absolutely stunning and brought so much joy to my home. I can’t recommend this flower shop enough!”</p>
                  </blockquote>
                  <figcaption class="review__author">Michael Ramirez</figcaption>
                </figure>
              </li>
              <li class="carousel__slide" data-carousel-slide>
                <figure class="review">
                  <blockquote class="review__quote">
                    <p>“The online flower shop I tried exceeded all my expectations. The bouquet was a work of art, and the flowers were so fresh and vibrant. It was the highlight of the event, and I’ll definitely be a repeat customer!”</p>
                  </blockquote>
                  <figcaption class="review__author">Emily Johnson</figcaption>
                </figure>
              </li>
              <li class="carousel__slide" data-carousel-slide>
                <figure class="review">
                  <blockquote class="review__quote">
                    <p>“I recently ordered flowers online for a friend’s birthday, and they were a hit! The arrangement was unique and beautifully presented. I’ve already shared the flower shop’s information with several friends — they’re that good!”</p>
                  </blockquote>
                  <figcaption class="review__author">Daniel Lee</figcaption>
                </figure>
              </li>
            </ul>
          </div>

          <div class="carousel__controls">
            <button class="carousel__arrow" type="button" data-carousel-prev aria-label="Previous review">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="m14.5 5-7 7 7 7"></path>
              </svg>
            </button>

            <ul class="carousel__indicators">
              <li>
                <button class="carousel__dot" type="button" data-carousel-dot aria-label="Show review 1: Sarah Thompson"></button>
              </li>
              <li>
                <button class="carousel__dot" type="button" data-carousel-dot aria-label="Show review 2: Michael Ramirez"></button>
              </li>
              <li>
                <button class="carousel__dot" type="button" data-carousel-dot aria-label="Show review 3: Emily Johnson"></button>
              </li>
              <li>
                <button class="carousel__dot" type="button" data-carousel-dot aria-label="Show review 4: Daniel Lee"></button>
              </li>
            </ul>

            <button class="carousel__arrow" type="button" data-carousel-next aria-label="Next review">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="m9.5 5 7 7-7 7"></path>
              </svg>
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
